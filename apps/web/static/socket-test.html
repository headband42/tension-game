<!DOCTYPE html>
<html>
<head>
  <title>Socket Test</title>
</head>
<body>
  <h1>Socket.io Test</h1>
  <div id="status">Loading...</div>
  <script type="module">
    import { io } from 'http://localhost:5173/node_modules/.vite/deps/socket__io-client.js';
    
    document.getElementById('status').textContent = 'Connecting...';
    
    const socket = io('http://localhost:3001', {
      transports: ['websocket', 'polling'],
    });
    
    socket.on('connect', () => {
      document.getElementById('status').textContent = 'Connected: ' + socket.id;
      console.log('Connected:', socket.id);
    });
    
    socket.on('disconnect', (reason) => {
      document.getElementById('status').textContent = 'Disconnected: ' + reason;
      console.log('Disconnected:', reason);
    });
    
    socket.on('connect_error', (err) => {
      document.getElementById('status').textContent = 'Error: ' + err.message;
      console.error('Connect error:', err);
    });
  </script>
</body>
</html>
